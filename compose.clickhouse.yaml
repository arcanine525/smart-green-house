# Isolated candidate stack. Existing PostgreSQL deployment is unchanged.
# Always supply a distinct project name when rehearsing the migration.
name: greenhouse-clickhouse
services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8@sha256:0152dd511befe6a2c2ef53e930726179669b08116da78500b37c51c96ff5ee77
    environment:
      CLICKHOUSE_DB: ${CH_DATABASE:-greenhouse}
      CLICKHOUSE_USER: ${CH_USER:-greenhouse}
      CLICKHOUSE_PASSWORD: ${CH_PASSWORD:-change-me-clickhouse-local}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
    volumes:
      - ch_data:/var/lib/clickhouse
      - ch_logs:/var/log/clickhouse-server
      - ./docker/clickhouse/local.xml:/etc/clickhouse-server/config.d/local.xml:ro
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, 'clickhouse-client --user "$${CLICKHOUSE_USER}" --password "$${CLICKHOUSE_PASSWORD}" --query "SELECT 1" >/dev/null']
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 20s
    cpus: ${GREENHOUSE_CH_CPUS:-1}
    mem_limit: ${GREENHOUSE_CH_MEMORY:-2g}
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
  ch-client:
    image: greenhouse-clickhouse-client:local
    build:
      context: .
      dockerfile: docker/clickhouse-client/Dockerfile
    environment:
      CH_HOST: clickhouse
      CH_PORT: '8123'
      CH_DATABASE: ${CH_DATABASE:-greenhouse}
      CH_USER: ${CH_USER:-greenhouse}
      CH_PASSWORD: ${CH_PASSWORD:-change-me-clickhouse-local}
    depends_on:
      clickhouse:
        condition: service_healthy
    networks: [backend]
    cpus: 0.5
    mem_limit: 256m
  ch-app:
    image: greenhouse-clickhouse-ui:local
    build:
      context: .
      dockerfile: docker/ui/Dockerfile
    profiles: [app]
    environment: &ch-app-env
      GREENHOUSE_BACKEND: clickhouse
      CH_HOST: clickhouse
      CH_PORT: '8123'
      CH_DATABASE: ${CH_DATABASE:-greenhouse}
      CH_USER: ${CH_USER:-greenhouse}
      CH_PASSWORD: ${CH_PASSWORD:-change-me-clickhouse-local}
      GREENHOUSE_RAW_DIR: /data/raw
      GREENHOUSE_CH_COORDINATOR: /candidate/coordinator
    depends_on:
      clickhouse:
        condition: service_healthy
    volumes:
      - ${GREENHOUSE_RAW_PATH:-./data/raw}:/data/raw:ro
      - ${GREENHOUSE_CH_STATE_PATH:-./tmp/clickhouse-state}:/candidate
    networks: [backend]
    cpus: 1
    mem_limit: 1536m
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; assert urllib.request.urlopen("http://127.0.0.1:8501/_stcore/health",timeout=2).read()==b"ok"']
      interval: 2s
      timeout: 3s
      retries: 40
      start_period: 5s
  ch-web:
    image: greenhouse-clickhouse-client:local
    profiles: [app]
    command: [python, -m, greenhouse.clickhouse.port_forward, --target-host, ch-app, --target-port, '8501']
    depends_on:
      ch-app:
        condition: service_healthy
    networks: [backend, frontend]
    ports:
      - '127.0.0.1:${GREENHOUSE_CH_APP_PORT:-18581}:8501'
    cpus: 0.1
    mem_limit: 64m
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; assert urllib.request.urlopen("http://127.0.0.1:8501/_stcore/health",timeout=2).read()==b"ok"']
      interval: 2s
      timeout: 3s
      retries: 40
      start_period: 3s
  ch-broker:
    image: eclipse-mosquitto:2.0.22@sha256:09b62ff32c2e7b64d4b431b9a89236073289b68db273de2b089edeb9b0d92b5c
    profiles: [sensor]
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ch_broker:/mosquitto/data
    networks: [backend]
    healthcheck:
      test: [CMD, mosquitto_pub, -h, 127.0.0.1, -t, spike/health, -m, ready, -q, '1']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s
    cpus: 0.1
    mem_limit: 128m
  ch-stream:
    image: greenhouse-clickhouse-processing:local
    build:
      context: .
      dockerfile: docker/processing/Dockerfile
    profiles: [sensor]
    environment:
      <<: *ch-app-env
      MQTT_HOST: ch-broker
      MQTT_PORT: '1883'
      SPARK_LOCAL_IP: 127.0.0.1
      PYSPARK_SUBMIT_ARGS: '--driver-memory 768m pyspark-shell'
      GREENHOUSE_STREAM_ID: ${GREENHOUSE_CH_STREAM_ID:-}
      GREENHOUSE_CHECKPOINT_GENERATION: ${GREENHOUSE_CH_GENERATION:-}
      GREENHOUSE_REPLAY_ID: ${GREENHOUSE_CH_REPLAY_ID:-}
      GREENHOUSE_REPLAY_SCOPE_ID: ${GREENHOUSE_CH_REPLAY_SCOPE_ID:-}
      GREENHOUSE_REPLAY_CYCLE_ID: ${GREENHOUSE_CH_REPLAY_CYCLE_ID:-}
      GREENHOUSE_REPLAY_COMPARTMENT_ID: ${GREENHOUSE_CH_REPLAY_COMPARTMENT_ID:-}
      GREENHOUSE_REPLAY_QUALITY_POLICY: AGC_QUALITY_V1
      GREENHOUSE_CH_REPLAY_CONFIG_VERSION: ${GREENHOUSE_CH_REPLAY_CONFIG_VERSION:-}
    depends_on:
      clickhouse:
        condition: service_healthy
      ch-broker:
        condition: service_healthy
    volumes:
      - ${GREENHOUSE_RAW_PATH:-./data/raw}:/data/raw:ro
      - ${GREENHOUSE_CH_STATE_PATH:-./tmp/clickhouse-state}:/candidate
      - ${GREENHOUSE_CH_READY_PATH:-./tmp/clickhouse-ready}:/data/ready:ro
      - ${GREENHOUSE_CH_CHECKPOINT_PATH:-./tmp/clickhouse-checkpoints}:/data/checkpoints
    networks: [backend]
    cpus: 1
    mem_limit: 1536m
    command: [python, -m, greenhouse, stream, --backend, clickhouse, --ready-dir, /data/ready, --checkpoint-dir, /data/checkpoints/replay, --max-rows-per-batch, '5000']
  ch-ui-test:
    image: greenhouse-clickhouse-ui:local
    profiles: [test]
    environment:
      <<: *ch-app-env
      GREENHOUSE_CH_INTEGRATION: '1'
      GREENHOUSE_CH_UI_TEST: '1'
    depends_on:
      clickhouse:
        condition: service_healthy
    networks: [backend]
    command: [python, -m, unittest, discover, -s, tests/clickhouse, -v]
    cpus: 1
    mem_limit: 1536m
networks:
  backend:
    internal: true
  frontend: {} # Only the fixed-destination localhost relay joins this bridge.
volumes:
  ch_data:
  ch_logs:
  ch_broker:
