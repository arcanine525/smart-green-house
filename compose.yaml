name: smart-greenhouse

x-database-env: &database-env
  PGHOST: db
  PGPORT: '5432'
  PGDATABASE: ${GREENHOUSE_DB_NAME:-greenhouse}
  PGUSER: ${GREENHOUSE_DB_USER:-greenhouse}
  PGPASSWORD: ${GREENHOUSE_DB_PASSWORD:?Copy .env.example to .env and set GREENHOUSE_DB_PASSWORD}

x-processing: &processing
  image: smart-greenhouse-processing:local
  build:
    context: .
    dockerfile: docker/processing/Dockerfile
  init: true
  networks: [backend]
  cpus: ${GREENHOUSE_JOB_CPUS:-1.5}
  mem_limit: ${GREENHOUSE_JOB_MEMORY:-2g}

x-sensor: &sensor
  image: smart-greenhouse-sensor:local
  build:
    context: .
    dockerfile: docker/sensor/Dockerfile
  init: true
  profiles: [sensor]
  networks: [backend]
  cpus: ${GREENHOUSE_SENSOR_CPUS:-0.2}
  mem_limit: ${GREENHOUSE_SENSOR_MEMORY:-128m}
  environment:
    <<: *database-env
    MQTT_HOST: broker
    MQTT_PORT: '1883'
  depends_on:
    broker:
      condition: service_healthy

x-processing-env: &processing-env
  <<: *database-env
  GREENHOUSE_IMPORT_DIR: /data/import
  GREENHOUSE_RAW_DIR: /data/raw
  GREENHOUSE_OUTPUT_DIR: /data/output
  MQTT_HOST: broker
  MQTT_PORT: '1883'
  SPARK_LOCAL_IP: 127.0.0.1
  PYSPARK_SUBMIT_ARGS: '--driver-memory ${GREENHOUSE_DRIVER_MEMORY:-768m} pyspark-shell'

services:
  db:
    image: postgres:17.10-bookworm@sha256:9b18b78397054fce88a9552e9d5a3ad5bb7fd258c5b3cc1c5028e46373d6ea8f
    environment:
      POSTGRES_DB: ${GREENHOUSE_DB_NAME:-greenhouse}
      POSTGRES_USER: ${GREENHOUSE_DB_USER:-greenhouse}
      POSTGRES_PASSWORD: ${GREENHOUSE_DB_PASSWORD:?Copy .env.example to .env and set GREENHOUSE_DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    cpus: ${GREENHOUSE_DB_CPUS:-0.5}
    mem_limit: ${GREENHOUSE_DB_MEMORY:-512m}

  broker:
    image: eclipse-mosquitto:2.0.22@sha256:09b62ff32c2e7b64d4b431b9a89236073289b68db273de2b089edeb9b0d92b5c
    profiles: [sensor, test]
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - broker_state:/mosquitto/data
    networks: [backend]
    healthcheck:
      test: [CMD, mosquitto_pub, -h, 127.0.0.1, -t, spike/health, -m, ready, -q, '1']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s
    cpus: ${GREENHOUSE_BROKER_CPUS:-0.1}
    mem_limit: ${GREENHOUSE_BROKER_MEMORY:-128m}

  job:
    # Base batch services stay enabled so plain `docker compose build` works.
    <<: *processing
    environment: *processing-env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ${GREENHOUSE_IMPORT_PATH:-./data/import}:/data/import:ro
      - ${GREENHOUSE_RAW_PATH:-./data/raw}:/data/raw:ro
      - outputs:/data/output
    # Successful environment check only; never claims ingest/transform is done.
    command: [python, -m, greenhouse, setup]

  app:
    image: smart-greenhouse-ui:local
    build:
      context: .
      dockerfile: docker/ui/Dockerfile
    # Also enabled by default; sensor adds services to this batch foundation.
    init: true
    environment: *database-env
    networks: [backend, frontend]
    ports:
      - '127.0.0.1:${GREENHOUSE_APP_PORT:-8501}:8501'
    # Read-only raw mount backs lineage verification from the day detail view;
    # snapshot IDs are mapped from the mount, missing mounts report unverified.
    volumes:
      - ${GREENHOUSE_RAW_PATH:-./data/raw}:/data/raw:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3).read()"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s
    cpus: ${GREENHOUSE_APP_CPUS:-0.5}
    mem_limit: ${GREENHOUSE_APP_MEMORY:-768m}

  simulator:
    <<: *sensor
    command: [python, -m, greenhouse, simulate, --publish]
    volumes:
      - ${GREENHOUSE_RAW_PATH:-./data/raw}:/data/raw:ro
      - simulator_outbox:/data/outbox

  collector:
    <<: *sensor
    command: [python, -m, greenhouse, collect]
    volumes:
      - collector_spool:/data/spool
      - raw_ready:/data/ready

  stream-worker:
    <<: *processing
    profiles: [sensor]
    cpus: ${GREENHOUSE_STREAM_CPUS:-1.0}
    mem_limit: ${GREENHOUSE_STREAM_MEMORY:-1536m}
    environment:
      <<: *processing-env
      GREENHOUSE_STREAM_ID: ${GREENHOUSE_STREAM_ID:-}
      GREENHOUSE_CHECKPOINT_GENERATION: ${GREENHOUSE_CHECKPOINT_GENERATION:-}
      GREENHOUSE_REPLAY_ID: ${GREENHOUSE_REPLAY_ID:-}
      GREENHOUSE_REPLAY_SCOPE_ID: ${GREENHOUSE_REPLAY_SCOPE_ID:-}
      GREENHOUSE_REPLAY_CYCLE_ID: ${GREENHOUSE_REPLAY_CYCLE_ID:-}
      GREENHOUSE_REPLAY_COMPARTMENT_ID: ${GREENHOUSE_REPLAY_COMPARTMENT_ID:-}
      GREENHOUSE_REPLAY_QUALITY_POLICY: ${GREENHOUSE_REPLAY_QUALITY_POLICY:-}
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
    command: [python, -m, greenhouse, stream]
    volumes:
      - raw_ready:/data/ready:ro
      - spark_checkpoints:/data/checkpoints
      - ${GREENHOUSE_RAW_PATH:-./data/raw}:/data/raw:ro
      - outputs:/data/output

  test-runner:
    <<: *processing
    profiles: [test]
    environment: *processing-env
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
    command: [python, -m, greenhouse, test, -q, -s]

  ui-test:
    # Water app tests in the UI image (Streamlit AppTest + psycopg fixture DBs).
    image: smart-greenhouse-ui:local
    build:
      context: .
      dockerfile: docker/ui/Dockerfile
    profiles: [test]
    init: true
    environment: *database-env
    networks: [backend]
    depends_on:
      db:
        condition: service_healthy
    command: [python, -m, pytest, tests/ui, -q, -s]
    cpus: ${GREENHOUSE_UI_CPUS:-0.5}
    mem_limit: ${GREENHOUSE_UI_MEMORY:-768m}

  snapshot:
    <<: *processing
    profiles: [tools]
    user: '0:0'
    command: [python, -m, greenhouse, snapshot]
    environment:
      GREENHOUSE_RAW_DIR: /data/raw
    volumes:
      - ${GREENHOUSE_IMPORT_PATH:-./data/import}:/data/import:ro
      - ${GREENHOUSE_RAW_PATH:-./data/raw}:/data/raw
      - outputs:/data/output

  dataset-download:
    <<: *processing
    profiles: [tools]
    user: '0:0'
    # Isolated setup-only egress. Job/test/stream retain backend internal.
    networks: [download]
    command: [python, -m, greenhouse, snapshot, --download]
    environment:
      GREENHOUSE_RAW_DIR: /data/raw
    volumes:
      - ${GREENHOUSE_RAW_PATH:-./data/raw}:/data/raw

  preview-build:
    image: smart-greenhouse-ui:local
    build:
      context: .
      dockerfile: docker/ui/Dockerfile
    profiles: [tools]
    # Export only: root can write a new host directory on Linux; app stays non-root.
    user: '0:0'
    init: true
    networks: [backend]
    command: [python, -m, greenhouse, preview, --output, /preview/preview.html]
    volumes:
      - ${GREENHOUSE_PREVIEW_PATH:-./data/output/preview}:/preview
    cpus: ${GREENHOUSE_APP_CPUS:-0.5}
    mem_limit: ${GREENHOUSE_APP_MEMORY:-768m}

networks:
  backend:
    internal: true
  frontend: {}
  download: {}

volumes:
  pg_data:
  broker_state:
  simulator_outbox:
  collector_spool:
  raw_ready:
  spark_checkpoints:
  outputs:
